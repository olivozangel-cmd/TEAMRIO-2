<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Gestor de Estudio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1> Mi Gestor de Estudio</h1>
        <p>Preparación para Finales y Universidad</p>
    </header>

    <main class="container">
        <!-- Panel lateral: Materias -->
        <aside class="sidebar">
            <h2>Materias</h2>
            <div class="input-group">
                <input type="text" id="subject-input" placeholder="Ej. Matemáticas, Biología...">
                <button id="add-subject-btn">+</button>
            </div>
            <ul id="subjects-list" class="subjects-list">
                <!-- Las materias se generarán aquí -->
            </ul>
        </aside>

        <!-- Área principal: Temas y Preguntas -->
        <section class="content">
            <div id="welcome-message" class="welcome-message">
                <h2>Selecciona o crea una materia para empezar a estudiar </h2>
            </div>

            <div id="subject-workspace" class="hidden">
                <h2 id="current-subject-title">Nombre de la Materia</h2>
                
                <div class="input-group">
                    <input type="text" id="topic-input" placeholder="Nuevo tema (Ej. Célula Eucariota)...">
                    <button id="add-topic-btn">Agregar Tema</button>
                </div>

                <div id="topics-container" class="topics-container">
                    <!-- Los temas interactivos se generarán aquí -->
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
